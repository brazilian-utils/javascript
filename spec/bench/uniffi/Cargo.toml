[package]
name = "brutils_uniffi"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "brutils_uniffi"
path = "src/lib.rs"

[dependencies]
uniffi = { version = "0.29", features = ["cli"] }

[build-dependencies]
uniffi = { version = "0.29", features = ["build"] }

[[bin]]
name = "uniffi-bindgen"
path = "src/bin.rs"

[profile.release]
opt-level = 3
