<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<title>Phone field</title>

<form id="form">
  <label for="phone">Phone</label>
  <input
    id="phone"
    name="phone"
    required
    inputmode="numeric"
    autocomplete="tel-national"
    placeholder="(00) 00000-0000"
    aria-describedby="phone-error"
  />
  <!-- On the page from the start: the submit below moves focus to the field it rejects, and a
       description is read once focus lands, so it needs no live region. -->
  <p id="phone-error"></p>
  <button type="submit">Submit</button>
</form>

<script type="module">
  import { formatPhone, isValidPhone, parsePhone } from "https://cdn.jsdelivr.net/npm/@brazilian-utils/brazilian-utils/+esm";

  /**
   * Formats the document typed into `input` in place and keeps the caret next to
   * the character being edited, so typing, deleting or pasting anywhere works.
   * @param {{ input: HTMLInputElement, inputType?: string, format: (value: string) => string }} params
   * @returns {string} The formatted value.
   */
  function mask({ input, inputType = "", format }) {
    let value = input.value;
    let caret = input.selectionStart ?? value.length;

    // A deleted separator would come straight back: delete the character next to it.
    if (inputType.startsWith("delete") && format(value).length > value.length) {
      if (inputType === "deleteContentBackward") caret -= 1;
      value = value.slice(0, caret) + value.slice(caret + 1);
    }

    // Formatting what comes before the caret says where the caret goes.
    const position = format(value.slice(0, caret)).length;

    input.value = format(value);
    input.setSelectionRange(position, position);

    return input.value;
  }

  const form = document.getElementById("form");
  const input = document.getElementById("phone");
  const error = document.getElementById("phone-error");

  // The field only masks: the form below is what validates.
  input.addEventListener("input", (event) => {
    mask({ input, inputType: event.inputType, format: (value) => formatPhone(value, { mask: "nanp" }) });
  });

  form.addEventListener("submit", (event) => {
    event.preventDefault();

    const value = parsePhone(input.value);
    const message = value ? (isValidPhone(value) ? "" : "Enter a valid Phone") : "Enter a Phone";

    input.setAttribute("aria-invalid", String(Boolean(message)));
    error.textContent = message;

    if (message) return input.focus();

    console.log({ phone: value });
  });
</script>
