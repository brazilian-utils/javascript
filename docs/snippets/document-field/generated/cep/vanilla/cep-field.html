<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<title>CEP field</title>

<form id="form">
  <label for="cep">CEP</label>
  <input
    id="cep"
    name="cep"
    required
    inputmode="numeric"
    autocomplete="postal-code"
    placeholder="00000-000"
    aria-describedby="cep-error"
  />
  <!-- On the page from the start: the submit below moves focus to the field it rejects, and a
       description is read once focus lands, so it needs no live region. -->
  <p id="cep-error"></p>
  <button type="submit">Submit</button>
</form>

<script type="module">
  import { formatCep, isValidCep, parseCep } from "https://cdn.jsdelivr.net/npm/@brazilian-utils/brazilian-utils/+esm";

  const form = document.getElementById("form");
  const input = document.getElementById("cep");
  const error = document.getElementById("cep-error");

  // The field only masks: the form below is what validates.
  input.addEventListener("input", (event) => {
    const format = formatCep;
    const inputType = event.inputType ?? "";

    let typed = input.value;
    let position = input.selectionStart ?? typed.length;

    // A deleted separator would come straight back: delete the character next to it.
    if (inputType.startsWith("delete") && format(typed).length > typed.length) {
      if (inputType === "deleteContentBackward") position -= 1;
      typed = typed.slice(0, position) + typed.slice(position + 1);
    }

    // Formatting what comes before the caret says where the caret goes.
    const caret = format(typed.slice(0, position)).length;

    input.value = format(typed);
    input.setSelectionRange(caret, caret);
  });

  form.addEventListener("submit", (event) => {
    event.preventDefault();

    const value = parseCep(input.value);
    const message = value ? (isValidCep(value) ? "" : "Enter a valid CEP") : "Enter a CEP";

    input.setAttribute("aria-invalid", String(Boolean(message)));
    error.textContent = message;

    if (message) return input.focus();

    console.log({ cep: value });
  });
</script>
