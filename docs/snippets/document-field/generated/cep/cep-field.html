<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<title>CEP field</title>

<form id="form">
  <label for="cep">CEP</label>
  <input
    id="cep"
    name="cep"
    required
    inputmode="numeric"
    autocomplete="postal-code"
    placeholder="00000-000"
    aria-describedby="cep-message"
  />
  <!-- A live region is announced when its text changes, so it stays on the page, empty. -->
  <output id="cep-message" for="cep"></output>
  <button type="submit">Submit</button>
</form>

<script type="module">
  import { formatCep, isValidCep } from "https://cdn.jsdelivr.net/npm/@brazilian-utils/brazilian-utils/+esm";

  /**
   * Formats the document typed into `input` in place and keeps the caret next to
   * the character being edited, so typing, deleting or pasting anywhere works.
   * @param {{ input: HTMLInputElement, inputType?: string, format: (value: string) => string }} params
   * @returns {string} The formatted value.
   */
  function mask({ input, inputType = "", format }) {
    let value = input.value;
    let caret = input.selectionStart ?? value.length;

    // A deleted separator would come straight back: delete the character next to it.
    if (inputType.startsWith("delete") && format(value).length > value.length) {
      if (inputType === "deleteContentBackward") caret -= 1;
      value = value.slice(0, caret) + value.slice(caret + 1);
    }

    // Formatting what comes before the caret says where the caret goes.
    const position = format(value.slice(0, caret)).length;

    input.value = format(value);
    input.setSelectionRange(position, position);

    return input.value;
  }

  const input = document.getElementById("cep");
  const message = document.getElementById("cep-message");

  document.getElementById("form").addEventListener("submit", (event) => {
    event.preventDefault();
    console.log(Object.fromEntries(new FormData(event.target)));
  });

  input.addEventListener("input", (event) => {
    const value = mask({ input, inputType: event.inputType, format: formatCep });
    const valid = isValidCep(value);
    const complete = valid || value.length === 9;

    input.setAttribute("aria-invalid", String(complete && !valid));
    // A form around the field refuses to submit an invalid CEP.
    input.setCustomValidity(complete && !valid ? "Enter a valid CEP" : "");
    message.textContent = complete ? (valid ? "✓ Valid CEP" : "✗ Invalid CEP") : "";
  });
</script>
