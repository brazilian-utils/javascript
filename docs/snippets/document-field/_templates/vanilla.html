<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<title>@@label@@ field</title>

<form id="form">
  <label for="@@kind@@">@@label@@</label>
  <input
    id="@@kind@@"
    name="@@kind@@"
    required
    inputmode="@@inputMode@@"
    autocomplete="@@autocomplete@@"
    placeholder="@@placeholder@@"
    aria-describedby="@@kind@@-error"
  />
  <!-- On the page from the start: the submit below moves focus to the field it rejects, and a
       description is read once focus lands, so it needs no live region. -->
  <p id="@@kind@@-error"></p>
  <button type="submit">Submit</button>
</form>

<script type="module">
  import { @@names@@ } from "https://cdn.jsdelivr.net/npm/@brazilian-utils/brazilian-utils/+esm";
  import { mask } from "./mask.js";

  const form = document.getElementById("form");
  const input = document.getElementById("@@kind@@");
  const error = document.getElementById("@@kind@@-error");

  // The field only masks: the form below is what validates.
  input.addEventListener("input", (event) => {
    const masked = mask({
      value: input.value,
      caret: input.selectionStart ?? input.value.length,
      inputType: event.inputType,
      format: @@formatJs@@,
    });

    input.value = masked.value;
    input.setSelectionRange(masked.caret, masked.caret);
  });

  form.addEventListener("submit", (event) => {
    event.preventDefault();

    const value = @@parseInput@@;
    const message = value ? (@@validatorPlain@@ ? "" : "Enter a valid @@label@@") : "Enter a @@label@@";

    input.setAttribute("aria-invalid", String(Boolean(message)));
    error.textContent = message;

    if (message) return input.focus();

    console.log({ @@kind@@: value });
  });
</script>
