<!doctype html>
<html lang="en">
<meta charset="utf-8" />
<title>@@label@@ field</title>

<form>
  <label>
    @@label@@
    <input
      id="@@kind@@"
      inputmode="@@inputMode@@"
      autocomplete="@@autocomplete@@"
      placeholder="@@placeholder@@"
      aria-describedby="@@kind@@-message"
    />
    <output id="@@kind@@-message" hidden></output>
  </label>
  <button type="submit">Submit</button>
</form>

<script type="module">
  import { @@names@@ } from "https://cdn.jsdelivr.net/npm/@brazilian-utils/brazilian-utils/+esm";

@@maskJs@@

  const input = document.getElementById("@@kind@@");
  const message = document.getElementById("@@kind@@-message");

  input.addEventListener("input", (event) => {
    const value = mask({ input, inputType: event.inputType, format: @@format@@ });
    const valid = @@validator@@;
    const complete = valid || value.length === @@length@@;

    input.setAttribute("aria-invalid", String(complete && !valid));
    // A form around the field refuses to submit an invalid @@label@@.
    input.setCustomValidity(complete && !valid ? "Enter a valid @@label@@" : "");
    message.hidden = !complete;
    message.textContent = valid ? "✓ Valid @@label@@" : "✗ Invalid @@label@@";
  });
</script>
