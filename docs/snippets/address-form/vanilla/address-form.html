<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <title>Address from a CEP</title>

  <form id="form">
    <label for="cep">CEP</label>
    <input
      id="cep"
      name="cep"
      inputmode="numeric"
      autocomplete="postal-code"
      placeholder="00000-000"
      aria-describedby="status"
    />
    <!-- On the page from the start, and announced when it gets its text. -->
    <output id="status"></output>

    <label for="street">Street</label>
    <input id="street" name="street" autocomplete="address-line1" />

    <label for="neighborhood">Neighborhood</label>
    <input id="neighborhood" name="neighborhood" />

    <label for="city">City</label>
    <input id="city" name="city" autocomplete="address-level2" />

    <label for="state">State</label>
    <input id="state" name="state" autocomplete="address-level1" maxlength="2" />
  </form>

  <script type="module">
    import {
      formatCep,
      getAddressInfoByCep,
      isValidCep,
    } from "https://cdn.jsdelivr.net/npm/@brazilian-utils/brazilian-utils/+esm";

    const form = document.getElementById("form");
    const cep = document.getElementById("cep");
    const status = document.getElementById("status");
    // A named control of a form is a property of it.
    const fill = (address) => {
      form.street.value = address.street ?? "";
      form.neighborhood.value = address.neighborhood ?? "";
      form.city.value = address.city ?? "";
      form.state.value = address.state ?? "";
    };

    // One lookup at a time: a newer CEP makes the answer to the older one worthless.
    // `getAddressInfoByCep` takes no signal, so the request is not stopped, but its answer is.
    let pending;

    cep.addEventListener("input", async () => {
      cep.value = formatCep(cep.value);

      pending?.abort();
      pending = new AbortController();

      const { signal } = pending;

      // Asking before the CEP is complete is asking for nothing.
      if (!isValidCep(cep.value)) {
        status.textContent = "";
        return;
      }

      status.textContent = "Looking it up…";
      cep.setAttribute("aria-busy", "true");

      try {
        const address = await getAddressInfoByCep(cep.value);

        if (signal.aborted) return;

        fill(address);
        status.textContent = "";
      } catch {
        if (signal.aborted) return;

        fill({});
        status.textContent = "No address for this CEP";
      } finally {
        if (!signal.aborted) cep.removeAttribute("aria-busy");
      }
    });
  </script>
</html>
