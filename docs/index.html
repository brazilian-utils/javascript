<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Brazilian Utils</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Zero-dependency, tree-shakeable utils for Brazilian-specific businesses: CPF, CNPJ, boleto, Pix, CEP, holidays and more." />
  <link rel="icon" type="image/png" sizes="32x32" href="https://raw.githubusercontent.com/brazilian-utils/brand/main/favicons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="https://raw.githubusercontent.com/brazilian-utils/brand/main/favicons/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/brazilian-utils/brand/main/favicons/apple-touch-icon.png" />
  <meta name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" />
  <link rel="stylesheet" href="//unpkg.com/docsify-themeable@0.9.0/dist/css/theme-simple-dark.css" />
</head>

<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'Brazilian Utils',
      logo: 'https://raw.githubusercontent.com/brazilian-utils/brand/main/icons/icon-js.svg',
      nameLink: {
        '/pt-br/': '/#/pt-br/',
        '/': '/#/'
      },
      alias: {
        '/': 'https://raw.githubusercontent.com/brazilian-utils/javascript/main/README.md',
        '/pt-br/': '/pt-br/getting-started.md'
      },
      repo: 'brazilian-utils/javascript',
      loadNavbar: true,
      loadSidebar: true,
      auto2top: true,
      subMaxLevel: 2,
      coverpage: {
        '/': '_coverpage.md',
        '/pt-br/': 'pt-br/_coverpage.md'
      },
      search: {
        paths: 'auto',
        placeholder: {
          '/pt-br/': 'Buscar',
          '/': 'Search'
        },
        noData: {
          '/pt-br/': 'Nenhum resultado',
          '/': 'No results'
        },
        depth: 3
      },
      copyCode: {
        buttonText: {
          '/pt-br/': 'Clique para copiar',
          '/': 'Copy to clipboard'
        },
        errorText: {
          '/pt-br/': 'Erro',
          '/': 'Error'
        },
        successText: {
          '/pt-br/': 'Copiado',
          '/': 'Copied'
        }
      },
    };
  </script>
  <script src="//unpkg.com/docsify@5.0.0/lib/docsify.min.js"></script>
  <script src="//unpkg.com/docsify@5.0.0/lib/plugins/search.min.js"></script>
  <script src="//unpkg.com/docsify@5.0.0/lib/plugins/emoji.min.js"></script>
  <script src="//unpkg.com/docsify-copy-code@3.0.2"></script>
  <script src="//unpkg.com/docsify-themeable@0.9.0"></script>
</body>

</html>
