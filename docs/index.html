  <!-- Router: docsify runs in history mode, so each page is a real URL (/getting-started,
       /pt-br/utilities) that crawlers index on its own, instead of one URL with hash routes.
       GitHub Pages serves /getting-started from getting-started.html, a copy of this shell that
       `npm run build:site` (scripts/site.ts) keeps in sync, one per page listed in _sidebar.md.
       Links from the hash-router era (/#/getting-started?id=usage) and .html URLs are rewritten
       to their history-mode form before docsify reads the location. -->
  <script>
    (function () {
      if (location.hash.indexOf('#/') === 0) {
        history.replaceState(null, '', location.hash.slice(1));
      } else if (/\.html$/.test(location.pathname)) {
        history.replaceState(null, '', location.pathname.replace(/(index)?\.html$/, '') + location.search + location.hash);
      }
    })();
  </script>

  <!-- Configuration -->
  <script>
    window.$docsify = {
      name: 'Brazilian Utils',
      logo: 'https://raw.githubusercontent.com/brazilian-utils/brand/main/icons/icon-js.svg',
      routerMode: 'history',
      nameLink: {
        '/pt-br/': '/pt-br/',
        '/': '/'
      },
      alias: {
        '/': 'https://raw.githubusercontent.com/brazilian-utils/javascript/main/README.md',
        '/pt-br/': '/pt-br/getting-started.md',
        // The guides live in a folder; they share their language's sidebar and navbar
        '/guides/_sidebar.md': '/_sidebar.md',
        '/guides/_navbar.md': '/_navbar.md',
        '/pt-br/guides/_sidebar.md': '/pt-br/_sidebar.md',
        '/pt-br/guides/_navbar.md': '/pt-br/_navbar.md'
      },
      repo: 'brazilian-utils/javascript',
      loadNavbar: true,
      loadSidebar: true,
      auto2top: true,
      subMaxLevel: 3,
      // Resolved relative to the route's folder, so the Portuguese cover is `_coverpage.md`
      // inside `pt-br/`, not `pt-br/_coverpage.md` (which docsify would fetch as
      // `/pt-br/pt-br/_coverpage.md` and leave the cover blank).
      coverpage: {
        '/': '_coverpage.md',
        '/pt-br/': '_coverpage.md'
      },
      search: {
        paths: 'auto',
        placeholder: {
          '/pt-br/': 'Buscar',
          '/': 'Search'
        },
        noData: {
          '/pt-br/': 'Nenhum resultado',
          '/': 'No results'
        },
        depth: 3
      },
      plugins: [
        // Every page carries a front matter block (title, description, keywords) and no heading
        // of its own; the front-matter plugin below strips the block, and this hook turns its
        // title into the page's H1.
        function (hook, vm) {
          hook.beforeEach(function (content) {
            var title = vm.frontmatter && vm.frontmatter.title;
            return title ? '# ' + title + '\n\n' + content : content;
          });
        },
        // The framework tabs of an example page, and the select that picks which document the
        // examples are about: every <div class="example" data-name> is a tab, and every
        // <div class="variant" data-variant data-demo> inside it is one document. The live demo of
        // the pair on screen, an iframe of docs/snippets, loads the first time it is shown and is
        // as tall as its content. Both choices are remembered.
        function (hook) {
          hook.doneEach(function () {
            var panels = [].slice.call(document.querySelectorAll('.example[data-name]'));
            if (panels.length === 0) return;

            var remember = function (key, value) {
              try { localStorage.setItem(key, value); } catch (error) {}
            };
            var remembered = function (key) {
              try { return localStorage.getItem(key); } catch (error) { return null; }
            };

            var variantsOf = function (panel) {
              return [].slice.call(panel.querySelectorAll('.variant[data-variant]'));
            };

            var frames = [];

            // Each demo measures itself and posts its height (docs/snippets/live/run.js), so the
            // frame is exactly as tall as what it runs, message by message.
            addEventListener('message', function (event) {
              if (event.origin !== location.origin || !event.data || event.data.type !== 'example-height') return;
              frames.forEach(function (frame) {
                if (event.source !== frame.contentWindow) return;
                frame.style.height = event.data.height + (frame.offsetHeight - frame.clientHeight) + 'px';
              });
            });

            // The files of one example, as an editor's tabs: one strip per variant, the file name
            // on each tab, one file on screen.
            var addFiles = function (holder) {
              var files = [].slice.call(holder.querySelectorAll('.file[data-file]'));
              if (files.length < 2 || holder.querySelector('.file-tabs')) return;

              var strip = document.createElement('div');
              strip.className = 'file-tabs';
              strip.setAttribute('role', 'tablist');

              var open = function (name) {
                files.forEach(function (file, index) {
                  var selected = file.dataset.file === name;
                  file.hidden = !selected;
                  strip.children[index].setAttribute('aria-selected', String(selected));
                });
              };

              files.forEach(function (file) {
                file.setAttribute('role', 'tabpanel');
                var button = document.createElement('button');
                button.type = 'button';
                button.setAttribute('role', 'tab');
                button.textContent = file.dataset.file;
                button.addEventListener('click', function () { open(file.dataset.file); });
                strip.appendChild(button);
              });

              files[0].parentNode.insertBefore(strip, files[0]);
              open(files[0].dataset.file);
            };

            var addDemo = function (holder) {
              if (!holder.dataset.demo || holder.querySelector('iframe')) return;
              var frame = document.createElement('iframe');
              frame.title = 'Live demo';
              frame.src = holder.dataset.demo;
              frames.push(frame);
              // Whatever the page says before the code says what the demo is: the demo comes after
              // it and before the code, wherever the page happens to keep the two.
              holder.insertBefore(frame, holder.querySelector('.file, .variant'));
            };

            var current = { tab: null, variant: null };

            var show = function () {
              panels.forEach(function (panel, index) {
                var selected = panel.dataset.name === current.tab;
                list.children[index].setAttribute('aria-selected', String(selected));
                panel.hidden = !selected;
                var variants = variantsOf(panel);
                if (variants.length === 0) {
                  if (selected) { addDemo(panel); addFiles(panel); }
                  return;
                }
                variants.forEach(function (variant) {
                  variant.hidden = variant.dataset.variant !== current.variant;
                  if (!selected || variant.hidden) return;
                  addDemo(variant);
                  addFiles(variant);
                });
              });
              remember('example-tab', current.tab);
              if (current.variant) remember('example-variant', current.variant);
            };

            var names = variantsOf(panels[0]).map(function (variant) {
              return variant.dataset.variant;
            });
            var picker = null;

            if (names.length > 0) {
              picker = document.createElement('label');
              picker.className = 'example-picker';
              picker.textContent = document.documentElement.lang === 'pt-BR' ? 'Documento' : 'Document';
              var select = document.createElement('select');
              names.forEach(function (name) {
                var option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                select.appendChild(option);
              });
              select.addEventListener('change', function () {
                current.variant = select.value;
                show();
              });
              picker.appendChild(select);
              current.variant = names.indexOf(remembered('example-variant')) === -1 ? names[0] : remembered('example-variant');
              select.value = current.variant;
            }

            var tabs = document.createElement('div');
            tabs.className = 'example-tabs';
            panels[0].parentNode.insertBefore(tabs, panels[0]);

            var list = document.createElement('div');
            list.className = 'example-tab-list';
            list.setAttribute('role', 'tablist');
            tabs.appendChild(list);

            // The tabs are what the strip is for; the document sits at the end of it, out of
            // their way, where a toolbar keeps the control that is not its navigation.
            if (picker) tabs.appendChild(picker);

            panels.forEach(function (panel) {
              panel.setAttribute('role', 'tabpanel');
              var button = document.createElement('button');
              button.type = 'button';
              button.setAttribute('role', 'tab');
              button.textContent = panel.dataset.name;
              button.addEventListener('click', function () {
                current.tab = panel.dataset.name;
                show();
              });
              list.appendChild(button);
            });

            var saved = remembered('example-tab');
            current.tab = panels.some(function (panel) { return panel.dataset.name === saved; })
              ? saved
              : panels[0].dataset.name;
            show();
          });
        },
        // Per-page metadata for search engines and link previews: the title, description,
        // canonical URL, language and hreflang pair of the page being shown, from its front
        // matter and route. The generated copies of this shell carry the same values statically
        // (scripts/site.ts), this hook keeps them right as the reader navigates.
        function (hook, vm) {
          var site = 'https://brazilian-utils.com.br';
          var siteDescription = JSON.parse(
            document.querySelector('script[type="application/ld+json"]').textContent
          )['@graph'][0].description;
          function set(selector, attribute, value) {
            var element = document.querySelector(selector);
            if (element) element.setAttribute(attribute, value);
          }
          function setAlternate(hreflang, href) {
            var element = document.querySelector('link[rel="alternate"][hreflang="' + hreflang + '"]');
            if (href === null) {
              if (element) element.remove();
              return;
            }
            if (!element) {
              element = document.createElement('link');
              element.rel = 'alternate';
              element.hreflang = hreflang;
              document.head.appendChild(element);
            }
            element.href = href;
          }
          function remove(selector) {
            var element = document.querySelector(selector);
            if (element) element.remove();
          }
          hook.doneEach(function () {
            var path = (vm.route && vm.route.path) || '/';
            var file = (vm.route && vm.route.file) || '';
            var frontmatter = vm.frontmatter || {};
            // A page docsify could not fetch (its 404 view): no canonical, alternates or
            // Open Graph URL for a URL that does not exist, only noindex, like 404.html.
            if (vm.route && vm.route.response && vm.route.response.ok === false) {
              document.title = 'Not found · Brazilian Utils';
              remove('link[rel="canonical"]');
              remove('meta[property="og:url"]');
              remove('link[type="text/markdown"]');
              setAlternate('en', null);
              setAlternate('pt-BR', null);
              setAlternate('x-default', null);
              if (!document.querySelector('meta[name="robots"]')) {
                var robots = document.createElement('meta');
                robots.name = 'robots';
                robots.content = 'noindex';
                document.head.appendChild(robots);
              }
              return;
            }
            var isPtBr = path.indexOf('/pt-br') === 0;
            var title = frontmatter.title ? frontmatter.title + ' · Brazilian Utils' : 'Brazilian Utils';
            var description = frontmatter.description || siteDescription;
            // An aliased route (see `alias`: /pt-br/ shows pt-br/getting-started) canonicalizes to
            // the page it shows; the English home is the README, which has no Portuguese twin.
            var aliased = vm.config.alias && vm.config.alias[path];
            var canonicalPath = aliased && aliased.indexOf('/') === 0 ? aliased.replace(/\.md$/, '') : path;
            var enPath = isPtBr ? canonicalPath.replace(/^\/pt-br\//, '/') : canonicalPath;
            var ptBrPath = isPtBr ? canonicalPath : canonicalPath === '/' ? null : '/pt-br' + canonicalPath;
            document.title = title;
            document.documentElement.lang = isPtBr ? 'pt-BR' : 'en';
            set('meta[name="description"]', 'content', description);
            set('link[rel="canonical"]', 'href', site + canonicalPath);
            setAlternate('en', site + enPath);
            setAlternate('pt-BR', ptBrPath === null ? null : site + ptBrPath);
            setAlternate('x-default', site + enPath);
            set('meta[property="og:title"]', 'content', title);
            set('meta[property="og:description"]', 'content', description);
            set('meta[property="og:url"]', 'content', site + canonicalPath);
            set('meta[property="og:locale"]', 'content', isPtBr ? 'pt_BR' : 'en_US');
            set('meta[property="og:locale:alternate"]', 'content', isPtBr ? 'en_US' : 'pt_BR');
            set('link[type="text/markdown"]', 'href', /^https?:/.test(file) ? file : site + '/' + file.replace(/^\//, ''));
          });
        },
      ],
      copyCode: {
        buttonText: {
          '/pt-br/': 'Clique para copiar',
          '/': 'Copy to clipboard'
        },
        errorText: {
          '/pt-br/': 'Erro',
          '/': 'Error'
        },
        successText: {
          '/pt-br/': 'Copiado',
          '/': 'Copied'
        }
      },
    };
  </script>

  <!-- Docsify 5: the major version pin picks up non-breaking releases automatically -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
  <!-- The search plugin indexes the raw Markdown through Docsify.get, without the front-matter
       plugin, so it would index the front matter as a heading and lose the page's title; this
       hands it every page the way it renders: the block gone, the title as the H1. -->
  <script>
    (function () {
      var get = Docsify.get;
      var FRONT_MATTER = /^---\n([\s\S]*?)\n---\n+/;
      Docsify.get = function (url, hasBar, headers) {
        var request = get(url, hasBar, headers);
        if (!/\.md(\?|$)/.test(url)) return request;
        return {
          then: function (success, error) {
            return request.then(function (text, opt) {
              var match = FRONT_MATTER.exec(text || '');
              if (match) {
                var title = /^title: "(.*)"$/m.exec(match[1]);
                text = (title ? '# ' + title[1].replace(/\\"/g, '"') + '\n\n' : '') + text.slice(match[0].length);
              }
              success(text, opt);
            }, error);
          },
          abort: request.abort
        };
      };
    })();
  </script>
