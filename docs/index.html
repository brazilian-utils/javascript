  <!-- Router: docsify runs in history mode, so each page is a real URL (/getting-started,
       /pt-br/utilities) that crawlers index on its own, instead of one URL with hash routes.
       GitHub Pages serves /getting-started from getting-started.html, a copy of this shell that
       `npm run build:site` (scripts/site.ts) keeps in sync, one per page listed in _sidebar.md.
       Links from the hash-router era (/#/getting-started?id=usage) and .html URLs are rewritten
       to their history-mode form before docsify reads the location. -->
  <script>
    (function () {
      if (location.hash.indexOf('#/') === 0) {
        history.replaceState(null, '', location.hash.slice(1));
      } else if (/\.html$/.test(location.pathname)) {
        history.replaceState(null, '', location.pathname.replace(/(index)?\.html$/, '') + location.search + location.hash);
      }
    })();
  </script>

<body class="loading sidebar-chevron-right">
  <div id="app"></div>
  <noscript>
    <p>

  <!-- Configuration -->
  <script>
    window.$docsify = {
      name: 'Brazilian Utils',
      logo: 'https://raw.githubusercontent.com/brazilian-utils/brand/main/icons/icon-js.svg',
      routerMode: 'history',
      nameLink: {
        '/pt-br/': '/pt-br/',
        '/': '/'
      },
      alias: {
        '/': 'https://raw.githubusercontent.com/brazilian-utils/javascript/main/README.md',
        '/pt-br/': '/pt-br/getting-started.md'
      },
      repo: 'brazilian-utils/javascript',
      loadNavbar: true,
      loadSidebar: true,
      auto2top: true,
      subMaxLevel: 3,
      // Resolved relative to the route's folder, so the Portuguese cover is `_coverpage.md`
      // inside `pt-br/`, not `pt-br/_coverpage.md` (which docsify would fetch as
      // `/pt-br/pt-br/_coverpage.md` and leave the cover blank).
      coverpage: {
        '/': '_coverpage.md',
        '/pt-br/': '_coverpage.md'
      },
      search: {
        paths: 'auto',
        placeholder: {
          '/pt-br/': 'Buscar',
          '/': 'Search'
        },
        noData: {
          '/pt-br/': 'Nenhum resultado',
          '/': 'No results'
        },
        depth: 3
      },
      plugins: [
        // Every page carries a front matter block (title, description, keywords) and no heading
        // of its own; the front-matter plugin below strips the block, and this hook turns its
        // title into the page's H1.
        function (hook, vm) {
          hook.beforeEach(function (content) {
            var title = vm.frontmatter && vm.frontmatter.title;
            return title ? '# ' + title + '\n\n' + content : content;
          });
        },
        // The live CPF field of examples.md: formats as you type and validates the result, with the
        // latest release imported from a CDN on that page only.
        function (hook) {
          hook.doneEach(function () {
            var demo = document.querySelector('.cpf-demo');
            if (!demo) return;
            var input = demo.querySelector('input');
            var output = demo.querySelector('output');
            import('https://cdn.jsdelivr.net/npm/@brazilian-utils/brazilian-utils/+esm').then(function (utils) {
              input.addEventListener('input', function () {
                input.value = utils.formatCpf(input.value);
                output.textContent = input.value.length === 14
                  ? (utils.isValidCpf(input.value) ? demo.dataset.valid : demo.dataset.invalid)
                  : '';
              });
            });
          });
        },
        // Per-page metadata for search engines and link previews: the title, description,
        // canonical URL, language and hreflang pair of the page being shown, from its front
        // matter and route. The generated copies of this shell carry the same values statically
        // (scripts/site.ts), this hook keeps them right as the reader navigates.
        function (hook, vm) {
          var site = 'https://brazilian-utils.com.br';
          var siteDescription = JSON.parse(
            document.querySelector('script[type="application/ld+json"]').textContent
          )['@graph'][0].description;
          function set(selector, attribute, value) {
            var element = document.querySelector(selector);
            if (element) element.setAttribute(attribute, value);
          }
          function setAlternate(hreflang, href) {
            var element = document.querySelector('link[rel="alternate"][hreflang="' + hreflang + '"]');
            if (href === null) {
              if (element) element.remove();
              return;
            }
            if (!element) {
              element = document.createElement('link');
              element.rel = 'alternate';
              element.hreflang = hreflang;
              document.head.appendChild(element);
            }
            element.href = href;
          }
          function remove(selector) {
            var element = document.querySelector(selector);
            if (element) element.remove();
          }
          hook.doneEach(function () {
            var path = (vm.route && vm.route.path) || '/';
            var file = (vm.route && vm.route.file) || '';
            var frontmatter = vm.frontmatter || {};
            // A page docsify could not fetch (its 404 view): no canonical, alternates or
            // Open Graph URL for a URL that does not exist, only noindex, like 404.html.
            if (vm.route && vm.route.response && vm.route.response.ok === false) {
              document.title = 'Not found · Brazilian Utils';
              remove('link[rel="canonical"]');
              remove('meta[property="og:url"]');
              remove('link[type="text/markdown"]');
              setAlternate('en', null);
              setAlternate('pt-BR', null);
              setAlternate('x-default', null);
              if (!document.querySelector('meta[name="robots"]')) {
                var robots = document.createElement('meta');
                robots.name = 'robots';
                robots.content = 'noindex';
                document.head.appendChild(robots);
              }
              return;
            }
            var isPtBr = path.indexOf('/pt-br') === 0;
            var title = frontmatter.title ? frontmatter.title + ' · Brazilian Utils' : 'Brazilian Utils';
            var description = frontmatter.description || siteDescription;
            // An aliased route (see `alias`: /pt-br/ shows pt-br/getting-started) canonicalizes to
            // the page it shows; the English home is the README, which has no Portuguese twin.
            var aliased = vm.config.alias && vm.config.alias[path];
            var canonicalPath = aliased && aliased.indexOf('/') === 0 ? aliased.replace(/\.md$/, '') : path;
            var enPath = isPtBr ? canonicalPath.replace(/^\/pt-br\//, '/') : canonicalPath;
            var ptBrPath = isPtBr ? canonicalPath : canonicalPath === '/' ? null : '/pt-br' + canonicalPath;
            document.title = title;
            document.documentElement.lang = isPtBr ? 'pt-BR' : 'en';
            set('meta[name="description"]', 'content', description);
            set('link[rel="canonical"]', 'href', site + canonicalPath);
            setAlternate('en', site + enPath);
            setAlternate('pt-BR', ptBrPath === null ? null : site + ptBrPath);
            setAlternate('x-default', site + enPath);
            set('meta[property="og:title"]', 'content', title);
            set('meta[property="og:description"]', 'content', description);
            set('meta[property="og:url"]', 'content', site + canonicalPath);
            set('meta[property="og:locale"]', 'content', isPtBr ? 'pt_BR' : 'en_US');
            set('meta[property="og:locale:alternate"]', 'content', isPtBr ? 'en_US' : 'pt_BR');
            set('link[type="text/markdown"]', 'href', /^https?:/.test(file) ? file : site + '/' + file.replace(/^\//, ''));
          });
        },
      ],
      copyCode: {
        buttonText: {
          '/pt-br/': 'Clique para copiar',
          '/': 'Copy to clipboard'
        },
        errorText: {
          '/pt-br/': 'Erro',
          '/': 'Error'
        },
        successText: {
          '/pt-br/': 'Copiado',
          '/': 'Copied'
        }
      },
    };
  </script>

  <!-- Docsify 5: the major version pin picks up non-breaking releases automatically -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>
  <!-- The search plugin indexes the raw Markdown through Docsify.get, without the front-matter
       plugin, so it would index the front matter as a heading and lose the page's title; this
       hands it every page the way it renders: the block gone, the title as the H1. -->
  <script>
    (function () {
      var get = Docsify.get;
      var FRONT_MATTER = /^---\n([\s\S]*?)\n---\n+/;
      Docsify.get = function (url, hasBar, headers) {
        var request = get(url, hasBar, headers);
        if (!/\.md(\?|$)/.test(url)) return request;
        return {
          then: function (success, error) {
            return request.then(function (text, opt) {
              var match = FRONT_MATTER.exec(text || '');
              if (match) {
                var title = /^title: "(.*)"$/m.exec(match[1]);
                text = (title ? '# ' + title[1].replace(/\\"/g, '"') + '\n\n' : '') + text.slice(match[0].length);
              }
              success(text, opt);
            }, error);
          },
          abort: request.abort
        };
      };
    })();
  </script>
