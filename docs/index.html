<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Brazilian Utils</title>
  <meta name="description" content="Zero-dependency, tree-shakeable utils for Brazilian-specific businesses: CPF, CNPJ, boleto, Pix, CEP, holidays and more." />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <link rel="icon" type="image/png" sizes="32x32" href="https://raw.githubusercontent.com/brazilian-utils/brand/main/favicons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="https://raw.githubusercontent.com/brazilian-utils/brand/main/favicons/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/brazilian-utils/brand/main/favicons/apple-touch-icon.png" />

  <!-- docsify 5 core theme with the dark add-on always on, the look the site had before v5;
       add media="(prefers-color-scheme: dark)" to the add-on to follow the system instead -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css" />
  <style>
    :root {
      /* The green of the official palette (github.com/brazilian-utils/brand) */
      --theme-color: #009739;
      /* The cover page shares the page background instead of the default gradient */
      --cover-bg: var(--color-bg);
      --cover-bg-overlay: none;
    }
  </style>
</head>

<body class="loading sidebar-chevron-right">
  <div id="app"></div>

  <!-- Configuration -->
  <script>
    window.$docsify = {
      name: 'Brazilian Utils',
      logo: 'https://raw.githubusercontent.com/brazilian-utils/brand/main/icons/icon-js.svg',
      nameLink: {
        '/pt-br/': '/#/pt-br/',
        '/': '/#/'
      },
      alias: {
        '/': 'https://raw.githubusercontent.com/brazilian-utils/javascript/main/README.md',
        '/pt-br/': '/pt-br/getting-started.md'
      },
      repo: 'brazilian-utils/javascript',
      loadNavbar: true,
      loadSidebar: true,
      auto2top: true,
      subMaxLevel: 3,
      coverpage: {
        '/': '_coverpage.md',
        '/pt-br/': 'pt-br/_coverpage.md'
      },
      search: {
        paths: 'auto',
        placeholder: {
          '/pt-br/': 'Buscar',
          '/': 'Search'
        },
        noData: {
          '/pt-br/': 'Nenhum resultado',
          '/': 'No results'
        },
        depth: 3
      },
      plugins: [
        // Every page carries a front matter block (title, description) for the Docs7 site and no
        // heading of its own; the front-matter plugin below strips the block, and this hook turns
        // its title into the page's H1 so docsify shows the same heading Docs7 renders.
        function (hook, vm) {
          hook.beforeEach(function (content) {
            var title = vm.frontmatter && vm.frontmatter.title;
            return title ? '# ' + title + '\n\n' + content : content;
          });
        },
      ],
      copyCode: {
        buttonText: {
          '/pt-br/': 'Clique para copiar',
          '/': 'Copy to clipboard'
        },
        errorText: {
          '/pt-br/': 'Erro',
          '/': 'Error'
        },
        successText: {
          '/pt-br/': 'Copiado',
          '/': 'Copied'
        }
      },
    };
  </script>

  <!-- Docsify 5: the major version pin picks up non-breaking releases automatically -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/docsify.min.js"></script>

  <!-- Plugins (emoji is built into docsify since 4.13, so its plugin is gone) -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/front-matter.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code@3/dist/docsify-copy-code.min.js"></script>
</body>

</html>
