<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Brazilian Utils</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Utils library for specific Brazilian businesses." />
  <meta name="viewport"
    content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0" />
  <link rel="stylesheet" href="//unpkg.com/docsify-themeable@0.9.0/dist/css/theme-simple-dark.css" />
</head>

<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      ga: 'UA-156179602-1',
      name: '🇧🇷 Brazilian Utils',
      nameLink: {
        '/pt-br/': '/#/pt-br/',
        '/': '/#/'
      },
      alias: {
        '/': 'https://raw.githubusercontent.com/brazilian-utils/javascript/main/README.md',
        '/pt-br/': '/pt-br/getting-started.md'
      },
      repo: 'brazilian-utils/javascript',
      loadNavbar: true,
      loadSidebar: true,
      auto2top: true,
      subMaxLevel: 2,
      coverpage: {
        '/': '_coverpage.md',
        '/pt-br/': '_coverpage.md'
      },
      copyCode: {
        buttonText: {
          '/pt-br/': 'Clique para copiar',
          '/': 'Copy to clipboard'
        },
        errorText: {
          '/pt-br/': 'Erro',
          '/': 'Error'
        },
        successText: {
          '/pt-br/': 'Copiado',
          '/': 'Copied'
        }
      },
    };
  </script>
  <script src="//unpkg.com/docsify@5.0.0/lib/docsify.min.js"></script>
  <script src="//unpkg.com/docsify@5.0.0/lib/plugins/ga.min.js"></script>
  <script src="//unpkg.com/docsify@5.0.0/lib/plugins/emoji.min.js"></script>
  <script src="//unpkg.com/docsify-copy-code@3.0.2"></script>
  <script src="//unpkg.com/docsify-themeable@0.9.0"></script>
</body>

</html>
